<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Luigi Zhou — LZ symbol language study." />
    <title>LZ Symbol Study — Luigi Zhou</title>
    <style>
      :root { background: #f4f3ef; color: #171717; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; }

      main {
        display: grid;
        gap: clamp(46px, 5vw, 82px);
        grid-template-columns: repeat(4, minmax(0, 1fr));
        min-height: 100svh;
        padding: clamp(28px, 4vw, 68px);
      }

      .study { display: grid; grid-template-rows: auto 1fr; min-height: clamp(240px, 25vw, 400px); }
      .study-primary { grid-column: span 2; min-height: clamp(420px, 45vw, 650px); }
      .study-variation { grid-column: span 1; }
      .study-watermark { grid-column: span 1; }
      .spatial-direction { grid-column: span 2; min-height: clamp(330px, 34vw, 520px); }

      .study-label { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; line-height: 1; margin: 0; }
      .symbol-stage { align-items: center; display: flex; justify-content: center; padding: clamp(34px, 5vw, 78px) 0 clamp(8px, 1.5vw, 24px); }
      .study-primary .symbol-stage { justify-content: flex-start; }
      .study-watermark .symbol-stage { justify-content: center; }

      svg { display: block; height: auto; max-height: min(42vw, 500px); overflow: visible; width: min(100%, 560px); }
      .study-watermark svg { max-height: 120px; width: min(100%, 142px); }
      .study-variation svg { max-height: 250px; width: min(100%, 300px); }

      .lz-route { fill: none; stroke: #171717; stroke-linecap: square; stroke-linejoin: bevel; }
      .route-primary { stroke-width: 72; }
      .route-variation { stroke-width: 70; }
      .plate-flat { fill: #171717; }
      .plate-main { fill: #171717; }
      .plate-light { fill: #2a2a2a; }
      .plate-dark { fill: #101010; }

      .direction-pair { align-items: end; display: grid; gap: clamp(24px, 3vw, 52px); grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .direction-pair > div { display: grid; gap: 18px; min-width: 0; }
      .direction-pair p { font-size: 10px; font-weight: 600; letter-spacing: 0.04em; line-height: 1; margin: 0; }
      .direction-pair svg { max-height: 300px; width: min(100%, 320px); }

      @media (max-width: 900px) {
        main { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 28px 24px 52px; }
        .study-primary,
        .spatial-direction { grid-column: span 2; }
        .study-primary { min-height: 450px; }
        .study { min-height: 290px; }
        .spatial-direction { min-height: 430px; }
        .study-primary .symbol-stage { justify-content: center; }
      }

      @media (max-width: 520px) {
        main { grid-template-columns: 1fr; }
        .study-primary,
        .study-variation,
        .study-watermark,
        .spatial-direction { grid-column: auto; }
        .direction-pair { gap: 36px; grid-template-columns: 1fr; }
        .study-primary { min-height: 430px; }
      }
    </style>
  </head>
  <body>
    <main aria-label="LZ symbol shape language study">
      <section class="study study-primary" aria-labelledby="primary-label">
        <p class="study-label" id="primary-label">A / PRIMARY — COMPRESSED FUSED SIGN</p>
        <div class="symbol-stage">
          <svg viewBox="50 40 520 470" role="img" aria-label="Compressed industrial LZ primary mark">
            <!-- Original L stem → foot → compressed Z diagonal → short top return. -->
            <path class="lz-route route-primary" d="M118 94 V430 H310 L514 94 H324" />
          </svg>
        </div>
      </section>

      <section class="study study-watermark" aria-labelledby="watermark-label">
        <p class="study-label" id="watermark-label">A / WATERMARK</p>
        <div class="symbol-stage">
          <svg viewBox="50 40 520 470" role="img" aria-label="Small compressed industrial LZ mark">
            <path class="lz-route route-primary" d="M118 94 V430 H310 L514 94 H324" />
          </svg>
        </div>
      </section>

      <section class="study study-variation" aria-labelledby="variation-one-label">
        <p class="study-label" id="variation-one-label">A / 01 — LOWER TERMINAL</p>
        <div class="symbol-stage">
          <svg viewBox="50 40 520 470" role="img" aria-label="LZ mark alternate with lower terminal">
            <path class="lz-route route-variation" d="M124 100 V422 H300 L486 130 H328" />
          </svg>
        </div>
      </section>

      <section class="study study-variation" aria-labelledby="variation-two-label">
        <p class="study-label" id="variation-two-label">A / 02 — OVERCUT DIAGONAL</p>
        <div class="symbol-stage">
          <svg viewBox="50 40 520 470" role="img" aria-label="LZ mark alternate with overcut diagonal">
            <path class="lz-route route-variation" d="M108 88 V438 H322 L512 112 H364" />
          </svg>
        </div>
      </section>

      <section class="study spatial-direction" aria-labelledby="direction-one-label">
        <p class="study-label" id="direction-one-label">B / 01 — BRACED PLATE</p>
        <div class="symbol-stage direction-pair">
          <div>
            <p>FLAT SILHOUETTE</p>
            <svg viewBox="50 40 520 470" role="img" aria-label="Braced plate flat silhouette">
              <!-- L platform and Z brace form a spatial derivative rather than an outline of A. -->
              <path class="plate-flat" d="M106 92 H184 V376 H286 L438 114 H526 V178 H478 L350 410 H398 V480 H124 L106 462 Z" />
            </svg>
          </div>
          <div>
            <p>FOLD INDICATION</p>
            <svg viewBox="50 40 520 470" role="img" aria-label="Braced plate with planar fold indication">
              <path class="plate-main" d="M106 92 H184 V376 H286 L438 114 H526 V178 H478 L350 410 H398 V480 H124 L106 462 Z" />
              <path class="plate-dark" d="M286 376 L438 114 H526 L350 410 H398 V480 H124 L106 462 V412 H286 Z" />
              <path class="plate-light" d="M438 114 H526 V178 H478 L438 150 Z" />
              <path class="plate-light" d="M106 412 H286 L350 480 H124 L106 462 Z" />
            </svg>
          </div>
        </div>
      </section>

      <section class="study spatial-direction" aria-labelledby="direction-two-label">
        <p class="study-label" id="direction-two-label">B / 02 — OFFSET FOLDED STRIP</p>
        <div class="symbol-stage direction-pair">
          <div>
            <p>FLAT SILHOUETTE</p>
            <svg viewBox="50 40 520 470" role="img" aria-label="Offset folded strip flat silhouette">
              <path class="plate-flat" d="M120 88 H198 V338 H282 L428 148 H522 V216 H476 L344 412 H318 V476 H142 L120 454 Z" />
            </svg>
          </div>
          <div>
            <p>FOLD INDICATION</p>
            <svg viewBox="50 40 520 470" role="img" aria-label="Offset folded strip with planar fold indication">
              <path class="plate-main" d="M120 88 H198 V338 H282 L428 148 H522 V216 H476 L344 412 H318 V476 H142 L120 454 Z" />
              <path class="plate-dark" d="M282 338 L428 148 H522 L344 412 H318 V476 H142 L120 454 V406 H282 Z" />
              <path class="plate-light" d="M428 148 H522 V216 H476 L428 190 Z" />
              <path class="plate-light" d="M120 406 H282 L318 476 H142 L120 454 Z" />
            </svg>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
